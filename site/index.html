<!DOCTYPE html>
<!-- cornerman build: dashboard-v3 -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cornerman — UFC fight analysis</title>
<style>
  :root{
    --ink:#0C0F14; --panel:#141921; --panel2:#1A2029; --line:#252C38;
    --soft:#1C222C; --bone:#ECE8E0; --mute:#8D95A6; --dim:#59616F;
    --red:#C8442F; --redsoft:#E87D68; --blue:#3E85B4; --bluesoft:#78B2D8;
    --gold:#CDA43A; --warn:#DE8C34; --good:#6FBF73;
    /* reserved for exactly one meaning: model and market disagree by 5+ pts */
    --hot:#FF5A36;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ink);color:var(--bone);
    font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
  .lbl{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
  .wrap{max-width:1680px;margin:0 auto;padding:0 18px}

  header{display:flex;align-items:center;gap:16px;padding:12px 0;
    border-bottom:1px solid var(--line);flex-wrap:wrap}
  .brand{font-weight:800;letter-spacing:.3em;font-size:12px;text-transform:uppercase;
    color:var(--bone)}
  .evline{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;flex:1;min-width:0}
  .evname{font-size:17px;font-weight:800;text-transform:uppercase;letter-spacing:-.02em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chip{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
    border:1px solid var(--line);color:var(--mute);padding:2px 7px;border-radius:999px;
    white-space:nowrap}

  /* divergence strip: the loudest thing on the page */
  .strip{display:flex;gap:10px;overflow-x:auto;padding:12px 0 4px;margin-bottom:6px}
  .dcard{flex:0 0 auto;min-width:214px;border:1px solid var(--warn);border-radius:4px;
    background:linear-gradient(180deg,rgba(222,140,52,.10),rgba(222,140,52,.02));
    padding:9px 12px;cursor:pointer;text-align:left;font:inherit;color:inherit}
  .dcard:hover{background:rgba(222,140,52,.16)}
  .dcard.calm{border-color:var(--line);background:var(--panel)}
  .dgap{font-size:22px;font-weight:800;letter-spacing:-.03em;color:var(--warn)}
  .dcard.calm .dgap{color:var(--mute)}

  .seg{margin-top:14px}
  .seghd{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
  .seghd h2{margin:0;font-size:11px;font-weight:800;letter-spacing:.2em;
    text-transform:uppercase;color:var(--bone)}
  .grid{display:grid;gap:9px;grid-template-columns:repeat(auto-fill,minmax(268px,1fr))}

  .tile{border:1px solid var(--line);background:var(--panel);border-radius:4px;
    padding:10px 11px;cursor:pointer;text-align:left;font:inherit;color:inherit;
    transition:border-color .15s,background .15s}
  .tile:hover{border-color:#3B4557;background:var(--panel2)}
  .tile:focus-visible{outline:2px solid var(--bluesoft);outline-offset:2px}
  .tile.wide{border-color:rgba(222,140,52,.55)}
  .trow{display:flex;justify-content:space-between;align-items:center;gap:6px}
  .nm{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:-.01em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:108px}
  .pnum{font-size:14px;font-weight:800}

  .gauge{position:relative;height:7px;border-radius:4px;background:var(--soft);
    display:flex;overflow:hidden;margin:5px 0 2px}
  .gauge i{display:block;height:100%}
  .mkt{position:relative;height:5px;border-radius:3px;background:var(--soft);overflow:hidden}
  .mkt i{display:block;height:100%;background:var(--gold);opacity:.7}
  .gaplink{position:relative;height:4px;margin:1px 0}
  .gaplink i{position:absolute;top:1px;height:2px;background:var(--warn);border-radius:1px}

  .props{display:flex;gap:5px;margin-top:7px;flex-wrap:wrap}
  .pp{font-size:9.5px;letter-spacing:.04em;padding:2px 6px;border-radius:3px;
    border:1px solid var(--line);color:var(--mute);white-space:nowrap}
  .pp b{color:var(--bone);font-weight:700}
  .pp.hot{border-color:rgba(205,164,58,.6);color:var(--gold)}
  .pp.hot b{color:var(--gold)}

  .noread{border:1px dashed var(--line);border-radius:4px;padding:9px 11px;
    font-size:11.5px;color:var(--dim)}

  /* detail drawer */
  .scrim{position:fixed;inset:0;background:rgba(5,7,10,.62);opacity:0;pointer-events:none;
    transition:opacity .18s;z-index:40}
  .scrim.on{opacity:1;pointer-events:auto}
  .draw{position:fixed;top:0;right:0;bottom:0;width:min(560px,96vw);background:var(--ink);
    border-left:1px solid var(--line);z-index:50;overflow-y:auto;
    transform:translateX(100%);transition:transform .2s ease}
  .draw.on{transform:none}
  .draw .inner{padding:18px 20px 40px}
  .xbtn{position:sticky;top:0;float:right;background:var(--ink);border:1px solid var(--line);
    color:var(--mute);font:inherit;font-size:12px;border-radius:4px;padding:3px 9px;cursor:pointer}
  .xbtn:hover{color:var(--bone)}
  .card{border:1px solid var(--line);background:var(--panel);border-radius:4px;
    padding:13px 15px;margin-bottom:12px}
  .pgroup{border:1px solid var(--line);border-radius:4px;margin-bottom:9px;overflow:hidden}
  .pgroup.priced{border-color:rgba(205,164,58,.5)}
  .ghead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;
    padding:7px 11px;background:var(--panel2);border-bottom:1px solid var(--line)}
  .gname{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
  .pgroup.priced .gname{color:var(--gold)}
  .prow{display:flex;align-items:center;gap:9px;padding:6px 11px}
  .prow+.prow{border-top:1px solid var(--soft)}
  .fo{width:52px;text-align:right;font-size:11px;color:var(--gold)}
  .rec{width:132px;text-align:right;font-size:9px;letter-spacing:.06em;text-transform:uppercase}
  .rec.none{color:#454D5B} .rec.good{color:var(--good)} .rec.bad{color:var(--warn)}
  .drv{display:flex;align-items:center;gap:9px;padding:5px 0}
  .drv .dt{flex:1;position:relative;height:7px}
  .drv .dt .bg{position:absolute;inset:0;background:var(--soft);border-radius:4px}
  .drv .dt .zero{position:absolute;left:50%;top:-3px;width:1px;height:13px;background:var(--line)}
  .drv .dt i{position:absolute;top:0;height:7px;border-radius:4px}
  .mrow{display:flex;align-items:center;gap:8px;margin-bottom:5px}
  .mrow span{font-size:11px;color:var(--mute);width:96px;flex:none}
  .mrow .t{flex:1;height:6px;background:var(--soft);border-radius:3px}
  .mrow .t i{display:block;height:6px;border-radius:3px}
  .mrow b{font-size:11px;width:42px;text-align:right}
  .edgeTag{font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;
    border-radius:3px;font-weight:700;white-space:nowrap;border:1px solid currentColor}
  .edgeTag.agree{color:var(--dim)} .edgeTag.lean{color:var(--mute)}
  .edgeTag.wide{color:var(--warn)} .edgeTag.hit{color:var(--good)} .edgeTag.miss{color:var(--red)}
  .ubar{display:inline-block;width:46px;height:3px;background:var(--soft);border-radius:2px;overflow:hidden}
  .ubar i{display:block;height:100%}
  .intro{position:relative;border:1px solid var(--line);border-left:3px solid var(--bluesoft);
    background:var(--panel);border-radius:4px;padding:14px 16px;margin:12px 0 4px;max-width:900px}
  .intro h3{margin:0 0 6px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--bluesoft)}
  .intro p{margin:0 0 7px;font-size:12.5px;line-height:1.6;color:var(--mute)}
  .intro p:last-child{margin-bottom:0}
  .intro b{color:var(--bone)}
  .xsm{position:absolute;top:8px;right:9px;background:none;border:none;color:var(--dim);
    cursor:pointer;font-size:13px;line-height:1;padding:2px 4px}
  .xsm:hover{color:var(--bone)}
  .tt{display:flex;align-items:baseline;gap:8px;padding:3px 0;border-bottom:1px solid var(--soft)}
  .tth{border-bottom:1px solid var(--line);padding-bottom:5px;margin-bottom:3px}
  .tth .tv{font-weight:800;font-size:11.5px;text-transform:uppercase;letter-spacing:-.01em;color:var(--bone)}
  .tt .tv{width:84px;flex:none;font-size:12px;color:var(--dim);
    font-family:ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
  .tt .tv.r{text-align:right}
  .tt .tv.lead{color:var(--bone);font-weight:700}
  .tt .tv.lead.a{color:var(--redsoft)} .tt .tv.lead.b{color:var(--bluesoft)}
  .tt .tk{flex:1;text-align:center;font-size:9.5px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--dim)}
  .drvraw{display:block;font-size:9.5px;letter-spacing:.06em;color:#4F5766;margin-top:1px;
    font-family:ui-monospace,Menlo,monospace}
  .verdict{font-size:13px;line-height:1.6;color:var(--mute);border-left:2px solid var(--line);
    padding-left:11px;margin-bottom:14px}
  .verdict b{color:var(--bone)}
  .filt{display:flex;align-items:center;gap:7px;margin:10px 0 2px;flex-wrap:wrap}
  .fb{font:inherit;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
    background:var(--panel);border:1px solid var(--line);color:var(--mute);
    padding:4px 11px;border-radius:999px;cursor:pointer}
  .fb:hover{border-color:#3B4557;color:var(--bone)}
  .fb.on{border-color:var(--gold);color:var(--gold)}
  .conds{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(258px,1fr))}
  .cond{border:1px solid var(--line);border-radius:4px;background:var(--panel);padding:9px 10px}
  .cond.flat{opacity:.72}
  .condhd{display:flex;flex-direction:column;gap:1px;margin-bottom:6px}
  .cname{font-size:11.5px;font-weight:700;letter-spacing:.02em}
  .qrow{display:flex;gap:4px}
  .qc{flex:1;text-align:center}
  .qc.thin{opacity:.42}
  .qbar{position:relative;height:42px;background:var(--soft);border-radius:3px;overflow:hidden}
  .qbar i{position:absolute;bottom:0;left:14%;width:72%;border-radius:2px 2px 0 0}
  .qbase{position:absolute;left:0;right:0;height:0;border-top:1px dashed #6A7382}
  .qc.mine .qbar{outline:1px solid #3B4557;outline-offset:1px}
  .qc.mine .qv{font-weight:800;color:var(--bone)}
  .qmk{height:11px;line-height:11px;font-size:9px;letter-spacing:1px}
  .qv{font-size:12.5px;margin-top:3px;font-weight:700}
  .qpct{font-size:8.5px;color:var(--dim);margin-left:1px}
  .qn{font-size:8.5px;letter-spacing:.08em}
  .cwhy{margin-top:5px;font-size:9px;letter-spacing:.06em;color:#4C5462}
  .dialrow{display:flex;align-items:center;gap:4px}
  .fcol{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:4px}
  .fcol.r{align-items:flex-end;text-align:right}
  .fcol .nm{max-width:100%}
  .gauge-svg{width:148px;height:82px;flex:none;overflow:visible}
  .g-track{fill:none;stroke:var(--soft);stroke-width:9;stroke-linecap:round}
  .g-side-a{fill:none;stroke:var(--red);stroke-width:3;opacity:.35}
  .g-side-b{fill:none;stroke:var(--blue);stroke-width:3;opacity:.35}
  .g-gap{fill:none;stroke:#5A6272;stroke-width:9;stroke-linecap:round;opacity:.7}
  .g-gap.hot{stroke:var(--hot);opacity:.95}
  .g-mkt{stroke:var(--gold);stroke-width:2.5;stroke-linecap:round}
  .g-open{stroke:var(--gold);stroke-width:1.5;stroke-dasharray:2 2;opacity:.8}
  .g-needle{stroke:var(--bone);stroke-width:2.5;stroke-linecap:round}
  .g-hub{fill:var(--bone)}
  .g-num{fill:var(--bone);font:800 17px ui-monospace,Menlo,monospace;text-anchor:middle}
  .gkey{display:flex;gap:10px;justify-content:center;font-size:9px;letter-spacing:.08em;
    text-transform:uppercase;color:var(--dim);margin-top:1px}
  .gkey span{display:flex;align-items:center;gap:4px}
  .gkey i{display:inline-block;width:10px;height:0}
  .k-needle{border-top:2px solid var(--bone)} .k-mkt{border-top:2px solid var(--gold)}
  .k-open{border-top:1.5px dashed var(--gold)}
  .mono-av{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;
    justify-content:center;font:800 10px ui-sans-serif,system-ui;letter-spacing:.02em;
    color:#fff;flex:none}
  .mono-av.a{background:var(--red)} .mono-av.b{background:var(--blue)}
  .tile.is-hot{border-color:rgba(255,90,54,.55);
    box-shadow:0 0 0 1px rgba(255,90,54,.18),0 6px 22px -12px rgba(255,90,54,.55)}
  .tile.is-hot:hover{border-color:var(--hot)}
  .dcard{border-color:rgba(255,90,54,.6)!important}
  .dcard .dgap{color:var(--hot)!important}
  .edgeTag.wide{color:var(--hot)!important;background:rgba(255,90,54,.10)}
  @media (prefers-reduced-motion:no-preference){
    .g-needle{transform-origin:74px 76px;animation:sweep .9s cubic-bezier(.2,.8,.2,1) both}
    @keyframes sweep{from{transform:rotate(var(--deg))} to{transform:rotate(0deg)}}
    .g-gap{stroke-dasharray:400;stroke-dashoffset:400;animation:draw .8s .35s ease-out forwards}
    @keyframes draw{to{stroke-dashoffset:0}}
    .tile{animation:rise .45s ease both}
    @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  }
  footer{border-top:1px solid var(--line);margin-top:22px;padding:14px 0 26px;
    font-size:10px;color:var(--dim);line-height:1.6}
  .note{font-size:10.5px;color:var(--dim);line-height:1.6}
  @media(max-width:700px){ .nm{max-width:84px} .wrap{padding:0 12px} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="brand">Cornerman</span>
    <div class="evline" id="evline"></div>
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:3px">
      <div class="mono" id="stamp" style="font-size:10.5px;color:var(--mute);white-space:nowrap"></div>
      <div class="mono" id="usage" style="font-size:9.5px;display:flex;align-items:center;gap:6px"></div>
    </div>
  </header>
  <div id="app" style="padding:4px 0 0"><div class="lbl">Loading…</div></div>
  <footer>
    Not affiliated with the UFC. Statistics from public records. Analysis tool, not betting
    advice — tested at 67% accuracy against 70% for the closing line. It does not beat the market.
    <span class="mono" style="color:#333A46"> · build dashboard-v3</span>
  </footer>
</div>
<div class="scrim" id="scrim"></div>
<aside class="draw" id="draw" aria-hidden="true"><div class="inner" id="drawin"></div></aside>

<script>
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const P1=x=>(x*100).toFixed(1), P0=x=>Math.round(x*100);
const SEGS=['Main card','Prelims','Early prelims'];
function fmtET(iso){
  // Eastern, to the minute, so you can tell which scheduled run produced
  // what is on screen. Intl handles the EDT/EST switch in November.
  if(!iso) return '';
  const d=new Date(iso); if(isNaN(d)) return '';
  try{
    return 'updated '+new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',
      month:'short',day:'numeric',hour:'numeric',minute:'2-digit',
      hour12:true,timeZoneName:'short'}).format(d);
  }catch(e){ return 'updated '+iso.slice(0,16)+' UTC'; }
}
/* Where the month's Odds API budget stands, read from headers the capture job
   already receives — checking it costs nothing. Amber under 100 credits, red
   under 30: a 429 in fight week would lose closing prices, the unrecoverable
   half of every CLV measurement. */
function showUsage(){
  const el=document.getElementById('usage'); if(!el||!USG||USG.remaining==null) return;
  const r=USG.remaining, tot=r+(USG.used||0), pct=tot?r/tot:0;
  const col=r<30?'var(--red)':r<100?'var(--warn)':'var(--mute)';
  el.innerHTML=`<span style="color:${col}">odds api: <b>${r}</b> of ${tot} credits left</span>
    <span class="ubar"><i style="width:${(pct*100).toFixed(0)}%;background:${col}"></i></span>`;
}
let DATA=null, HIST=null, BR=null, SC=null, USG=null, ONLY_GAPS=false;

function gap(b){ return b.edge==null?null:Math.abs(b.edge); }
function tag(b){
  if(b.edge==null) return '<span class="edgeTag agree">no line</span>';
  const e=Math.abs(b.edge), who=(b.edge>0?b.a:b.b).split(' ').slice(-1)[0];
  if(e<0.05) return '<span class="edgeTag agree">in line</span>';
  return `<span class="edgeTag ${e>=0.12?'wide':'lean'}">${b.edge>0?'▲':'▼'} ${(e*100).toFixed(0)} ${esc(who)}</span>`;
}

/* the model-vs-market strip, first thing on the page */
/* A first-time visitor has no idea what this is, and the most important
   thing to say is the least flattering one: it does not beat the market.
   Leading with that is the only way the rest of the numbers mean anything. */
function intro(){
  let seen=false; try{ seen=localStorage.getItem('cm_intro')==='1'; }catch(e){}
  if(seen) return '';
  return `<div class="intro">
    <button class="xsm" id="dismiss" title="dismiss">✕</button>
    <h3>What this is</h3>
    <p>A statistical model of UFC fights, trained only on fights that happened before
    the ones it is scoring. For each bout it publishes a probability for the winner and
    fifteen other markets — method, round, totals, takedowns, knockdowns — plus the fair
    price each one implies.</p>
    <p><b>It does not beat the betting market.</b> Tested on 829 fights it had never seen,
    it called 67% of winners against the closing line's 70%, and where the two disagreed
    the market was right more often. That is measured, published, and not expected to change.</p>
    <p>What it offers instead is <b>a number with its workings shown</b>: which features moved
    it, what happened historically in fights that looked similar, and a growing record of how
    often each market's projections have actually come in. A price tells you what to pay.
    This tells you why, and how much to trust it.</p>
  </div>`;
}

function strip(){
  const w=DATA.bouts.filter(b=>b.edge!=null).sort((x,y)=>Math.abs(y.edge)-Math.abs(x.edge));
  if(!w.length) return `<div class="note" style="padding:10px 0">No market prices in this
    build — add <span class="mono">ODDS_API_KEY</span> and the model-vs-market comparison appears here.</div>`;
  const top=w.slice(0,5);
  return `<div class="strip">${top.map(b=>{
    const e=Math.abs(b.edge), who=e>0?(b.edge>0?b.a:b.b):b.a;
    const mine=b.edge>0?b.p_a:b.p_b, theirs=b.edge>0?b.p_market:1-b.p_market;
    return `<button class="dcard ${e>=0.05?'':'calm'}" data-id="${esc(b.bout)}">
      <div class="lbl">model vs market</div>
      <div style="display:flex;align-items:baseline;gap:8px;margin:3px 0 2px">
        <span class="dgap mono">${b.edge>0?'+':'−'}${(e*100).toFixed(1)}</span>
        <span class="nm" style="max-width:120px">${esc(who)}</span></div>
      <div class="mono" style="font-size:10.5px;color:var(--mute)">
        ${P1(mine)}% vs <span style="color:var(--gold)">${P1(theirs)}%</span> market</div>
    </button>`;}).join('')}</div>`;
}

function propChips(b){
  const c=[];
  if(b.p_finish!=null) c.push(`<span class="pp ${b.p_finish>=.6?'hot':''}">ITD <b>${P0(b.p_finish)}%</b></span>`);
  const td=Math.max(b.a_p_takedown||0,b.b_p_takedown||0);
  const who=(b.a_p_takedown||0)>=(b.b_p_takedown||0)?b.a:b.b;
  if(td) c.push(`<span class="pp ${td>=.7?'hot':''}">TD ${esc(who.split(' ').slice(-1)[0])} <b>${P0(td)}%</b></span>`);
  if(b.totals&&b.totals.over_2_5!=null) c.push(`<span class="pp">O2.5 <b>${P0(b.totals.over_2_5)}%</b></span>`);
  const kd=Math.max(b.a_p_knockdown||0,b.b_p_knockdown||0);
  if(kd>=.3) c.push(`<span class="pp ${kd>=.45?'hot':''}">KD <b>${P0(kd)}%</b></span>`);
  return `<div class="props">${c.join('')}</div>`;
}

/* Two fighters with three UFC bouts between them get the same confident
   percentage as two twenty-fight veterans. The number of prior fights is the
   single biggest determinant of how much the model can know, and it was
   being used as a gate and then thrown away. */
function evChip(b,short){
  const e=b.evidence; if(!e) return '';
  const thin=e.min<5;
  if(short) return thin?` · <span style="color:var(--warn)">thin: ${e.min} prior</span>`:'';
  return `<span class="lbl" style="color:${thin?'var(--warn)':'var(--dim)'}">
    evidence: ${e.a} and ${e.b} prior UFC fights${thin?' — thin, treat with caution':''}</span>`;
}

/* One dial per bout. Needle = the model, solid tick = the market now, hollow
   tick = where the line opened. The arc between model and market is the
   disagreement, shaded in the one saturated colour on the site so the eye
   goes straight to it. Reading left to right is the red corner's chance. */
function gauge(b){
  // The needle points AT the favoured fighter: red corner on the left, blue
  // on the right, matching the names either side of the dial. The first
  // version mapped a high red-corner probability to the right, so a 71%
  // favourite's needle pointed at his opponent — the dial contradicting its
  // own number. Rendered and caught before it shipped.
  const W=148,H=82,cx=W/2,cy=76,R=62;
  const pt=(p,r)=>{const t=Math.PI*p;return [cx+r*Math.cos(t),cy-r*Math.sin(t)];};
  // pt(1) is the far left, pt(0) the far right; draw left-to-right over the top
  const arc=(p1,p2,r)=>{const hi=Math.max(p1,p2),lo=Math.min(p1,p2);
    const[x1,y1]=pt(hi,r),[x2,y2]=pt(lo,r);
    return `M${x1.toFixed(1)},${y1.toFixed(1)} A${r},${r} 0 0 1 ${x2.toFixed(1)},${y2.toFixed(1)}`;};
  const mk=b.p_market!=null, op=b.p_open!=null;
  const hot=mk&&Math.abs(b.p_a-b.p_market)>=0.05;
  const [nx,ny]=pt(b.p_a,R-8);
  const tick=(p,cls)=>{const[a1,b1]=pt(p,R+6),[a2,b2]=pt(p,R-6);
    return `<line class="${cls}" x1="${a1.toFixed(1)}" y1="${b1.toFixed(1)}" x2="${a2.toFixed(1)}" y2="${b2.toFixed(1)}"/>`;};
  const favA=b.p_a>=.5;
  return `<svg class="gauge-svg" viewBox="0 0 ${W} ${H}" role="img"
      aria-label="model favours ${esc(favA?b.a:b.b)} at ${P0(Math.max(b.p_a,b.p_b))} percent${mk?', market has '+esc(b.a)+' at '+P0(b.p_market):''}">
    <path d="${arc(0,1,R)}" class="g-track"/>
    <path d="${arc(.5,1,R)}" class="g-side-a"/><path d="${arc(0,.5,R)}" class="g-side-b"/>
    ${mk?`<path d="${arc(b.p_a,b.p_market,R)}" class="g-gap ${hot?'hot':''}"/>`:''}
    ${op?tick(b.p_open,'g-open'):''}
    ${mk?tick(b.p_market,'g-mkt'):''}
    <line class="g-needle" x1="${cx}" y1="${cy}" x2="${nx.toFixed(1)}" y2="${ny.toFixed(1)}"
      style="--deg:${(180*b.p_a-90).toFixed(1)}deg"/>
    <circle cx="${cx}" cy="${cy}" r="3.5" class="g-hub"/>
    <text x="${cx}" y="${cy-18}" class="g-num" style="fill:${favA?'var(--redsoft)':'var(--bluesoft)'}">${P0(Math.max(b.p_a,b.p_b))}</text>
  </svg>`;
}
function mono(name,cls){
  const p=String(name).trim().split(/\s+/);
  const i=(p[0][0]+(p.length>1?p[p.length-1][0]:'')).toUpperCase();
  return `<span class="mono-av ${cls}">${esc(i)}</span>`;
}

function tile(b){
  const mk=b.p_market!=null, hot=mk&&Math.abs(b.edge)>=0.05;
  return `<button class="tile ${hot?'is-hot':''}" data-id="${esc(b.bout)}">
    <div class="trow" style="margin-bottom:2px">
      <span class="lbl">${b.rounds===5?'5 rds':'3 rds'}${evChip(b,true)}</span>${tag(b)}</div>
    <div class="dialrow">
      <div class="fcol">${mono(b.a,'a')}<span class="nm" style="color:${b.p_a>=.5?'var(--bone)':'var(--mute)'}">${esc(b.a)}</span></div>
      ${gauge(b)}
      <div class="fcol r">${mono(b.b,'b')}<span class="nm" style="color:${b.p_a<.5?'var(--bone)':'var(--mute)'}">${esc(b.b)}</span></div>
    </div>
    <div class="gkey">
      <span><i class="k-needle"></i>model</span>
      ${mk?`<span><i class="k-mkt"></i>market ${P0(b.p_market)}</span>`:''}
      ${b.p_open!=null?`<span><i class="k-open"></i>opened ${P0(b.p_open)}</span>`:''}
    </div>
    ${propChips(b)}
  </button>`;
}

/* Every registered condition, every quartile, always — including the flat
   ones. A conditional-rate display that only shows strong relationships is
   indistinguishable from one that selects them; the null rows are the
   evidence the list was fixed in advance (PREREGISTRATION addendum 10). */
function baseRatePanel(here,bout){
  if(!BR||!BR.conditions) return '';
  // Bar height is the RATE, with a dashed line across all four quartiles at
  // the overall base rate. The first version drew lift-from-base at a fixed
  // scale, which rendered every flat condition as an identical hairline and
  // left the numbers unexplained — you could not tell 51 from 47 by looking,
  // and nothing said 51 was a percentage.
  const rows=BR.conditions.map(c=>{
    // "Flat" now means no quartile is distinguishable from the overall rate,
    // which is the actual claim, rather than a spread below an arbitrary cut.
    const nsig=c.cells.filter(q=>Math.abs(q.rate-c.base)>q.ci).length;
    const flat=nsig===0;
    const mk=here?here[c.id]:null;
    const top=Math.max(c.base,...c.cells.map(q=>q.rate))*1.25||1;
    const cells=c.cells.map(q=>{
      const hits=[];
      if(mk){
        if(mk.a===q.q) hits.push(['var(--red)',bout?bout.a:'A']);
        if(mk.b===q.q) hits.push(['var(--blue)',bout?bout.b:'B']);
        if(mk.fight===q.q) hits.push(['var(--gold)','this fight']);
      }
      // Colour only where the cell is actually distinguishable from the
      // overall rate. 51% against a 49% base is a two-point gap inside its
      // own error bar: painting it gold asserts a difference the eye cannot
      // check and the data does not support. Those cells stay neutral.
      const diff=q.rate-c.base, sig=Math.abs(diff)>q.ci;
      const fill = !sig ? '#39414E' : (diff>0 ? 'var(--gold)' : '#7C8695');
      return `<div class="qc ${hits.length?'mine':''} ${q.thin?'thin':''}"
        title="${esc(c.label)} quartile ${q.q} (${q.lo} to ${q.hi}): happened in ${(q.rate*100).toFixed(1)}% of ${q.n} fights, ±${(q.ci*100).toFixed(1)} — ${sig?((diff>0?'above':'below')+' the '+(c.base*100).toFixed(0)+'% overall rate'):'not distinguishable from the '+(c.base*100).toFixed(0)+'% overall rate'}">
        <div class="qbar">
          <i style="height:${(q.rate/top*100).toFixed(1)}%;background:${fill}"></i>
          <div class="qbase" style="bottom:${(c.base/top*100).toFixed(1)}%"></div></div>
        <div class="qmk">${hits.map(([col,nm])=>`<span style="color:${col}" title="${esc(nm)}">▲</span>`).join('')}</div>
        <div class="mono qv">${(q.rate*100).toFixed(0)}<span class="qpct">%</span></div>
        <div class="lbl qn">n ${q.n<1000?q.n:(q.n/1000).toFixed(1)+'k'}</div></div>`;}).join('');
    const scope=c.level==='fighter'?'per fighter':'whole fight';
    return `<div class="cond ${flat?'flat':''}">
      <div class="condhd">
        <span class="cname">${esc(c.outcome_label.charAt(0).toUpperCase()+c.outcome_label.slice(1))}</span>
        <span class="lbl">grouped by <b style="color:var(--mute)">${esc(c.label.toLowerCase())}</b>,
          lowest quarter first · ${scope}</span>
      </div>
      <div class="qrow">${cells}</div>
      <div class="lbl cwhy"><span style="color:#7C8695">- - -</span> ${(c.base*100).toFixed(0)}% across all fights
        · ${esc(c.why)}${flat?' · <b style="color:#7C8695">FLAT — no quarter differs from the overall rate</b>'
          :` · ${nsig} of ${c.cells.length} quarters differ`}</div>
    </div>`;}).join('');
  const key=here&&bout
    ? `<span style="color:var(--red)">▲ ${esc(bout.a)}</span> ·
       <span style="color:var(--blue)">▲ ${esc(bout.b)}</span> ·
       <span style="color:var(--gold)">▲ whole fight</span>`
    : 'bar = share of past fights with that outcome · dashed line = the rate across all fights';
  return `<div class="seg"><div class="seghd"><h2>What usually happens</h2>
      <span class="lbl">${key}</span></div>
    <div class="conds">${rows}</div>
    <div class="note" style="margin-top:8px"><b style="color:var(--mute)">How to use this.</b>
      Each row takes one measurement, sorts every past fight by it, and splits them into four
      equal groups — lowest quarter on the left. The bar is the share of that group where the
      outcome happened, and the dashed line is the rate across all fights combined. A bar clearly
      above the line means fights in that group really do produce the outcome more often.
      <b style="color:var(--mute)">Gold or grey-blue means the gap is bigger than the sampling
      error; dark bars are not distinguishable from the overall rate</b>, however they look. <b style="color:var(--mute)">This is not an edge.</b> Bookmakers price base rates
      too — it is context for reading a projection, so you can see whether a model number is mostly
      just the base rate or whether the model is leaning on something beyond it. Flat conditions
      are shown on purpose: a panel that only displayed strong relationships would be
      indistinguishable from one that picked them.</div></div>`;
}

function lastCard(){
  const c=HIST&&HIST.cards&&HIST.cards[0]; if(!c) return '';
  const pc=Math.round(100*c.right/c.n);
  return `<div class="seg"><div class="seghd">
      <h2 style="color:var(--good)">Last card — ${esc(c.event)}</h2>
      <span class="lbl">${c.right}/${c.n} winners correct · ${pc}%</span></div>
    <div class="grid">${c.bouts.map(b=>{
      const t=Math.floor(b.seconds/60)+':'+String(b.seconds%60).padStart(2,'0');
      return `<div class="tile" style="cursor:default">
        <div class="trow" style="margin-bottom:4px"><span class="lbl">${esc(b.method)} · ${t}</span>
          <span class="edgeTag ${b.model_right?'hit':'miss'}">${b.model_right?'✓':'✗'} ${P0(Math.max(b.p_a,1-b.p_a))}%</span></div>
        <div class="nm" style="max-width:100%">${esc(b.winner)}</div>
        <div class="lbl" style="margin-top:3px">${esc(b.bout)}</div></div>`;}).join('')}</div></div>`;
}

function render(){
  const d=DATA;
  document.getElementById('evline').innerHTML=
    `<span class="evname">${esc(d.event||'Upcoming card')}</span>
     <span class="chip mono" style="color:var(--gold);border-color:var(--gold)">${esc(d.date||'')}</span>
     <span class="chip">${esc(d.venue||'')}</span>
     <span class="chip">${d.bouts.length} modelled</span>
     ${d.market_source?`<span class="chip">market: ${esc(d.market_source)}</span>`:''}`;
  const pass=b=>!ONLY_GAPS||(b.edge!=null&&Math.abs(b.edge)>=0.05);
  const nGaps=d.bouts.filter(b=>b.edge!=null&&Math.abs(b.edge)>=0.05).length;
  const segs=SEGS.map(s=>{
    const bs=d.bouts.filter(b=>(b.segment||'Main card')===s).filter(pass);
    const nr=ONLY_GAPS?[]:(d.no_read||[]).filter(n=>(n.segment||'Main card')===s);
    if(!bs.length&&!nr.length) return '';
    return `<div class="seg"><div class="seghd"><h2>${esc(s)}</h2>
        <span class="lbl">${bs.length} bout${bs.length===1?'':'s'}${nr.length?` · ${nr.length} no read`:''}</span></div>
      <div class="grid">${bs.map(tile).join('')}
        ${nr.map(n=>`<div class="noread"><b>${esc(n.a)}</b> vs. <b>${esc(n.b)}</b>
          <div class="lbl" style="margin-top:4px">No read — ${esc(n.reason)}</div></div>`).join('')}</div></div>`;
  }).join('');
  const filt=`<div class="filt">
      <button class="fb ${ONLY_GAPS?'':'on'}" data-f="all">All ${d.bouts.length} bouts</button>
      <button class="fb ${ONLY_GAPS?'on':''}" data-f="gaps">Only disagreements${nGaps?` (${nGaps})`:''}</button>
      <span class="lbl" style="margin-left:6px">a disagreement is 5+ points from the market</span></div>`;
  document.getElementById('app').innerHTML=intro()+strip()+filt+segs+lastCard()+baseRatePanel(null,null)+`
    <div class="note" style="margin-top:16px;max-width:900px">
      Win probability is a logistic model on 14 opponent-adjusted differentials, trained only on
      earlier fights. Method and round come from a competing-risks hazard model and sum to 100%.
      Ranges cover the real result 79% of the time against a claimed 80%. Only the moneyline
      carries a market price; every prop below it is a projection with nothing to check it against.
    </div>`;
  document.querySelectorAll('[data-id]').forEach(el=>
    el.addEventListener('click',()=>open_(el.dataset.id)));
  document.querySelectorAll('[data-f]').forEach(el=>
    el.addEventListener('click',()=>{ ONLY_GAPS = el.dataset.f==='gaps'; render(); }));
  const dm=document.getElementById('dismiss');
  if(dm) dm.addEventListener('click',()=>{ try{localStorage.setItem('cm_intro','1');}catch(e){} render(); });
}

/* ---- drawer ---- */
/* The number a reader actually wants next to a projection: what happened in
   past fights that looked like this one. Without it, "60.5%" has nothing to
   be judged against — and the whole point of the base-rate panel is to be
   that comparison, which it cannot do from the other end of the drawer. */
function baseFor(cid, side, bands){
  if(!BR||!bands||!bands[cid]) return null;
  const c=BR.conditions.find(x=>x.id===cid); if(!c) return null;
  const q=bands[cid][side]; if(!q) return null;
  const cell=c.cells.find(x=>x.q===q); if(!cell) return null;
  return {rate:cell.rate, base:c.base, q:q, n:cell.n};
}
function vsBase(cid, side, bands, model){
  const b=baseFor(cid,side,bands); if(!b) return null;
  const d=model-b.rate;
  const verdict=Math.abs(d)<0.05?'in line with':(d>0?'above':'below');
  return `fights like this: ${(b.rate*100).toFixed(0)}% (Q${b.q}, n=${b.n}) — model is ${verdict} it`;
}

/* A probability is not the unit a reader checks a sportsbook in. Printing the
   fair price next to it removes the arithmetic between "the model says 60.5%"
   and "the book is offering -140", which is the whole point of a sidecar. */
function fairOdds(p){
  p=Math.min(Math.max(p,1e-6),1-1e-6);
  const dec=(1/p), us = p>=0.5 ? -100*p/(1-p) : 100*(1-p)/p;
  return {dec:dec.toFixed(2), us:(us>0?'+':'')+Math.round(us)};
}
/* A market shows its own record, or says it has none yet. Borrowing the
   winner model's credibility for a round-3 projection would be the easiest
   dishonest thing this site could do. */
function marketRecord(mk){
  const m=SC&&SC.markets&&SC.markets[mk];
  if(!m||m.n<25) return {txt:'no record yet', cls:'none', n:m?m.n:0};
  const better=m.skill>0;
  return {txt:`${m.n} graded · ${better?'beats':'below'} base rate`, cls:better?'good':'bad', n:m.n};
}

function propRow(name,p,col,marker,note,mkey){
  const mk=marker==null?'':`<div style="position:absolute;left:calc(${marker*100}% - 4px);top:-3px;
    color:var(--gold);font-size:10px;line-height:1">◆</div>`;
  return `<div class="prow">
    <div style="width:146px;flex:none;font-size:11.5px;color:var(--mute)">${esc(name)}
      ${note?`<span class="lbl" style="display:block;margin-top:1px">${esc(note)}</span>`:''}</div>
    <div style="flex:1;position:relative;height:8px">
      <div style="position:absolute;inset:0;background:var(--soft);border-radius:4px"></div>
      <div style="position:absolute;left:0;top:0;height:8px;border-radius:4px;
        width:${Math.max(0,Math.min(100,p*100))}%;background:${col}"></div>${mk}</div>
    <div class="mono" style="width:48px;text-align:right;font-size:12px;font-weight:600">${P1(p)}%</div>
    <div class="mono fo" title="fair price implied by this probability">${fairOdds(p).us}</div>
    ${mkey?(()=>{const r=marketRecord(mkey);
      return `<span class="rec ${r.cls}" title="${r.n} graded claims for this market">${esc(r.txt)}</span>`;})():'<span class="rec none"></span>'}
    </div>`;
}
/* Ranges need a shared axis per stat and an explicit label, or the reader is
   left with two bare numbers and no idea what they measure. Both fighters are
   drawn on the same scale so the comparison is visual, and the median is
   marked inside the band. */
function rangeBlock(stat,unit,rows){
  const top=Math.max(...rows.map(r=>r[3]))*1.08||1;
  return `<div style="margin-bottom:12px">
    <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px">
      <span class="lbl" style="color:var(--mute)">${esc(stat)}</span>
      <span class="lbl">${esc(unit)}</span></div>
    ${rows.map(([n,lo,mid,hi,c])=>`
      <div style="display:flex;align-items:center;gap:9px;padding:3px 0">
        <span style="width:104px;flex:none;font-size:11.5px;color:var(--mute);
          white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(n)}</span>
        <div style="flex:1;position:relative;height:14px">
          <div style="position:absolute;top:5px;left:0;right:0;height:5px;
            background:var(--soft);border-radius:3px"></div>
          <div style="position:absolute;top:5px;height:5px;border-radius:3px;background:${c};
            left:${lo/top*100}%;width:${Math.max(1,(hi-lo)/top*100)}%"></div>
          <div style="position:absolute;top:2px;width:2px;height:11px;background:var(--bone);
            left:${mid/top*100}%"></div>
        </div>
        <span class="mono" style="width:84px;text-align:right;font-size:11.5px">
          ${lo.toFixed(1)}–${hi.toFixed(1)}</span>
      </div>`).join('')}</div>`;
}

function group(title,sub,rows,priced){
  if(!rows.length) return '';
  return `<div class="pgroup${priced?' priced':''}"><div class="ghead">
    <span class="gname">${esc(title)}</span><span class="lbl">${esc(sub)}</span></div>${rows.join('')}</div>`;
}
/* One calibration line for the whole group, not a note on every row.
   Repeating "said likely -> 72% happened" under each fighter read as a claim
   about that fighter; it is a property of the takedown model across 394
   held-out fights, and identical for both corners by construction. */
function trackLine(){
  const t=DATA.track_record||{}, bits=[];
  const td=t.takedown&&t.takedown.said_likely, kd=t.knockdown;
  if(td) bits.push(`takedowns: said ~${Math.round(td.avg_said*100)}% → ${Math.round(td.happened*100)}% happened (${td.n} fights)`);
  if(kd&&kd.said_unlikely) bits.push(`knockdowns: said ~${Math.round(kd.said_unlikely.avg_said*100)}% → ${Math.round(kd.said_unlikely.happened*100)}%`);
  return bits.join(' · ') || 'projection only';
}

/* One sentence before any number. Sixteen markets is a lot to arrive at
   cold; this says what the model thinks in the order a person would say it. */
function verdictLine(b){
  const fav = b.p_a>=.5?b.a:b.b, pf=Math.max(b.p_a,b.p_b);
  const strength = pf<.56?'barely favours':pf<.68?'favours':'strongly favours';
  let t = `The model ${strength} <b>${esc(fav)}</b> at ${P0(pf)}%`;
  if(b.edge!=null){
    const e=Math.abs(b.edge);
    t += e<0.05 ? `, essentially where the market has it.`
      : `, while the market says ${P0(b.edge>0?b.p_market:1-b.p_market)}% — a <b>${(e*100).toFixed(0)}-point disagreement</b>.`;
  } else t += '.';
  const fin=b.p_finish!=null?b.p_finish:null;
  if(fin!=null){
    const rr=[1,2,3,4,5].map(k=>[k,b['p_end_r'+k]]).filter(x=>x[1]!=null).sort((x,y)=>y[1]-x[1])[0];
    t += fin>=.55 ? ` It expects an early finish — ${P0(fin)}% inside the distance${rr?`, most likely round ${rr[0]}`:''}.`
       : fin<=.4 ? ` It expects this to go the distance (${P0(b.m_decision)}%).`
       : ` It is split on whether this goes the distance.`;
  }
  const td=Math.max(b.a_p_takedown||0,b.b_p_takedown||0);
  if(td>=.65){
    const who=(b.a_p_takedown||0)>=(b.b_p_takedown||0)?b.a:b.b;
    t += ` Grappling is the likeliest story: ${esc(who)} lands a takedown ${P0(td)}% of the time in spots like this.`;
  }
  return t;
}

const STAT_ROWS=[
  ['record','Record',v=>v],['age','Age',v=>v],['reach','Reach',v=>v+'"'],
  ['elo','Career rating',v=>v],['opp_elo','Opposition faced',v=>v],
  ['slpm','Strikes landed /min',v=>v],['sapm','Strikes absorbed /min',v=>v],
  ['str_acc','Striking accuracy',v=>(v*100).toFixed(0)+'%'],
  ['str_def','Striking defence',v=>(v*100).toFixed(0)+'%'],
  ['td15','Takedowns /15min',v=>v],
  ['td_def','Takedown defence',v=>(v*100).toFixed(0)+'%'],
  ['ctrl','Control share',v=>(v*100).toFixed(0)+'%'],
  ['sub15','Sub attempts /15min',v=>v],['kd15','Knockdowns /15min',v=>v],
];
/* The numbers the model is reasoning over. It was showing contributions in
   standard deviations and never the values themselves, so "age +0.90" gave a
   reader no way to see that one man is 36 and the other 24. */
function tale(b){
  const A=b.stats&&b.stats.a, B=b.stats&&b.stats.b;
  if(!A||!B) return '';
  const rows=STAT_ROWS.filter(([k])=>A[k]!==undefined).map(([k,lab,fmt])=>{
    const na=parseFloat(A[k]), nb=parseFloat(B[k]);
    const cmp=(isNaN(na)||isNaN(nb))?0:(na>nb?1:na<nb?-1:0);
    return `<div class="tt">
      <div class="tv ${cmp>0?'lead a':''}">${esc(String(fmt(A[k])))}</div>
      <div class="tk">${esc(lab)}</div>
      <div class="tv r ${cmp<0?'lead b':''}">${esc(String(fmt(B[k])))}</div></div>`;}).join('');
  return `<div class="card"><div class="ghead" style="background:none;border:none;padding:0 0 8px">
      <span class="gname">Tale of the tape</span>
      <span class="lbl">career to date, before this fight</span></div>
    <div class="tt tth"><div class="tv">${esc(b.a)}</div><div class="tk"></div>
      <div class="tv r">${esc(b.b)}</div></div>${rows}</div>`;
}
const DRV_STAT={'age':'age','career quality':'elo','strength of schedule':'opp_elo',
  'experience':'n_fights','striking output':'slpm','strikes absorbed':'sapm',
  'striking accuracy':'str_acc','striking defence':'str_def','reach':'reach',
  'durability':'ko_loss','takedown threat':'td15','knockout threat':'kd15',
  'submission threat':'sub15'};
function drvRaw(b,label){
  const k=DRV_STAT[label]; if(!k||!b.stats) return '';
  const a=b.stats.a[k], c=b.stats.b[k]; if(a===undefined) return '';
  const f=v=>(k==='str_acc'||k==='str_def'||k==='td_def'||k==='ko_loss')?(v*100).toFixed(0)+'%':v;
  return `<span class="drvraw">${esc(String(f(a)))} v ${esc(String(f(c)))}</span>`;
}

function open_(id){
  const b=DATA.bouts.find(x=>x.bout===id); if(!b) return;
  const mk=b.p_market!=null;
  const drv=(b.drivers||[]);
  const mx=drv.length?Math.max(...drv.map(d=>Math.abs(d.value))):1;
  const rr=[1,2,3,4,5].map(k=>[k,b['p_end_r'+k]]).filter(x=>x[1]!=null);
  const totals=b.totals?Object.keys(b.totals).map(k=>
    propRow(`Over ${k.replace('over_','').replace('_','.')} rounds`,b.totals[k],'var(--gold)',null,null,'total_'+k)):[];
  document.getElementById('drawin').innerHTML=`
    <button class="xbtn" id="xb">close ✕</button>
    <div class="lbl">${esc(b.segment||'')} · ${b.rounds===5?'5 rounds':'3 rounds'}</div>
    <div style="margin-top:2px">${evChip(b,false)}</div>
    <div style="font-size:19px;font-weight:800;text-transform:uppercase;letter-spacing:-.02em;margin:4px 0 10px">
      ${esc(b.a)} <span style="color:var(--dim)">vs</span> ${esc(b.b)}</div>
    <div class="verdict">${verdictLine(b)}</div>
    ${mk?`<div class="card" style="border-left:3px solid ${Math.abs(b.edge)>=.12?'var(--warn)':'var(--line)'}">
      <div class="ghead" style="background:none;border:none;padding:0 0 8px">
        <span class="gname">Model vs market</span>${tag(b)}</div>
      <div style="display:flex;align-items:flex-end;gap:16px">
        <div><div class="lbl">model</div><div class="mono" style="font-size:26px;font-weight:800">${P1(b.p_a)}%</div></div>
        <div style="font-size:18px;color:var(--dim);padding-bottom:4px">→</div>
        <div><div class="lbl" style="color:var(--gold)">market</div>
          <div class="mono" style="font-size:26px;font-weight:800;color:var(--gold)">${P1(b.p_market)}%</div></div>
        <div style="margin-left:auto;text-align:right"><div class="lbl">gap</div>
          <div class="mono" style="font-size:26px;font-weight:800;color:${Math.abs(b.edge)>=.12?'var(--warn)':'var(--mute)'}">
            ${b.edge>0?'+':'−'}${(Math.abs(b.edge)*100).toFixed(1)}</div></div></div>
      <div class="note" style="margin-top:9px">Tested, the market wins these disagreements more
        often than we do. Treat a gap as an argument, not a tip.</div></div>`:''}
    ${drv.length?`<div class="card"><div class="ghead" style="background:none;border:none;padding:0 0 6px">
      <span class="gname">Why</span><span class="lbl">push on the log-odds</span></div>
      ${drv.map(d=>{const w=Math.abs(d.value)/mx*50, red=d.favours==='a';
        return `<div class="drv"><div style="width:148px;flex:none;font-size:11.5px;color:var(--mute)">${esc(d.label)}${drvRaw(b,d.label)}</div>
          <div class="dt"><div class="bg"></div><div class="zero"></div>
            <i style="${red?'right:50%':'left:50%'};width:${w}%;background:${red?'var(--red)':'var(--blue)'}"></i></div>
          <div class="mono" style="width:52px;text-align:right;font-size:11px;color:var(--dim)">${d.value>0?'+':''}${d.value.toFixed(2)}</div></div>`;}).join('')}
      </div>`:''}
    <div class="card"><div class="ghead" style="background:none;border:none;padding:0 0 8px">
      <span class="gname">All markets priced</span><span class="lbl">probability · fair price · track record</span></div>
      ${group('Winner',mk?'market price shown':'no feed',[
        propRow(`${b.a} wins`,b.p_a,'var(--red)',mk?b.p_market:null,mk?`market ${P1(b.p_market)}%`:null,'winner_a'),
        propRow(`${b.b} wins`,b.p_b,'var(--blue)',mk?1-b.p_market:null,mk?`market ${P1(1-b.p_market)}%`:null)],mk)}
      ${group('How long','from the survival curve',[
        propRow('Goes the distance',b.m_decision,'var(--mute)',null,vsBase('C9','fight',b.bands,b.m_decision),'decision'),
        propRow('Ends inside distance',b.p_finish,'var(--warn)',null,vsBase('C4','fight',b.bands,b.p_finish),'inside_distance')].concat(totals))}
      ${group('Method','sums to 100% with decision',[
        propRow(`${b.a} by KO/TKO`,b.m_a_ko,'var(--red)',null,null,'ko_a'),
        propRow(`${b.a} by submission`,b.m_a_sub,'var(--red)',null,null,'sub_a'),
        propRow(`${b.b} by KO/TKO`,b.m_b_ko,'var(--blue)',null,null,'ko_b'),
        propRow(`${b.b} by submission`,b.m_b_sub,'var(--blue)',null,null,'sub_b')])}
      ${group('Finish round','projection only',rr.map(([k,v])=>propRow(`Ends in round ${k}`,v,'var(--gold)',null,null,'end_r'+k)))}
      ${group('Fight action',trackLine(),[
        propRow(`${b.a} lands a takedown`,b.a_p_takedown,'var(--red)',null,vsBase('C1','a',b.bands,b.a_p_takedown),'takedown_a'),
        propRow(`${b.b} lands a takedown`,b.b_p_takedown,'var(--blue)',null,vsBase('C1','b',b.bands,b.b_p_takedown),'takedown_b'),
        propRow(`${b.a} scores a knockdown`,b.a_p_knockdown,'var(--red)',null,vsBase('C3','a',b.bands,b.a_p_knockdown),'knockdown_a'),
        propRow(`${b.b} scores a knockdown`,b.b_p_knockdown,'var(--blue)',null,vsBase('C3','b',b.bands,b.b_p_knockdown),'knockdown_b')])}
    </div>
    ${tale(b)}
    ${b.bands?`<div class="card"><div class="ghead" style="background:none;border:none;padding:0 0 8px">
      <span class="gname">Where this bout sits</span><span class="lbl">markers show each corner</span></div>
      ${baseRatePanel(b.bands,b)}</div>`:''}
    <div class="card"><div class="ghead" style="background:none;border:none;padding:0 0 8px">
      <span class="gname">Projected output</span><span class="lbl">80% range</span></div>
      ${rangeBlock('Significant strikes','per min',
          [[b.a,b.a_slpm_lo,b.a_slpm_mid,b.a_slpm_hi,'var(--red)'],
           [b.b,b.b_slpm_lo,b.b_slpm_mid,b.b_slpm_hi,'var(--blue)']])}
      ${rangeBlock('Control time','sec per min',
          [[b.a,b.a_ctrl_lo,b.a_ctrl_mid,b.a_ctrl_hi,'var(--red)'],
           [b.b,b.b_ctrl_lo,b.b_ctrl_mid,b.b_ctrl_hi,'var(--blue)']])}
      <div class="note" style="margin-top:6px">A single fight's stat line is mostly noise, so these
        are ranges. The model explains ~11% of the variance but ranks fights better than a career average.</div>
    </div>`;
  document.getElementById('xb').addEventListener('click',close_);
  document.getElementById('draw').classList.add('on');
  document.getElementById('draw').setAttribute('aria-hidden','false');
  document.getElementById('scrim').classList.add('on');
}
function close_(){
  document.getElementById('draw').classList.remove('on');
  document.getElementById('draw').setAttribute('aria-hidden','true');
  document.getElementById('scrim').classList.remove('on');
}
document.getElementById('scrim').addEventListener('click',close_);
document.addEventListener('keydown',e=>{ if(e.key==='Escape') close_(); });

Promise.all([
  fetch('predictions.json',{cache:'no-store'}).then(r=>{ if(!r.ok) throw new Error('predictions.json not found ('+r.status+')'); return r.json(); }),
  fetch('history.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).catch(()=>null),
  fetch('baserates.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).catch(()=>null),
  fetch('scorecard.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).catch(()=>null),
  fetch('usage.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).catch(()=>null)
]).then(([j,h,br,sc,us])=>{
  DATA=j; HIST=h; BR=br; SC=sc; USG=us;
  showUsage();
  document.getElementById('stamp').textContent=fmtET(j.generated_utc);
  render();
}).catch(e=>{
  document.getElementById('app').innerHTML='<div class="note"><b>Could not load predictions.</b><br>'+
    esc(e.message)+'<br><br>Run <span class="mono">python -m mmastat.upcoming --json</span>.</div>';
});
</script>
</body>
</html>
