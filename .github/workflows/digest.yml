# Save as .github/workflows/digest.yml
#
# Sends DIGEST.md to Buttondown. Reads the file the collector already writes.
# Needs one secret: BUTTONDOWN_KEY (Buttondown > Settings > Programming > API key)

name: digest

on:
  schedule:
    - cron: "0 13 * * 1"          # Mondays, 13:00 UTC
  workflow_dispatch:
    inputs:
      mode:
        description: 'draft = create without sending, send = deliver to subscribers'
        required: true
        default: 'draft'
        type: choice
        options: [draft, send]

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Build the payload
        env:
          MODE: ${{ github.event.inputs.mode || 'send' }}
        run: |
          test -f DIGEST.md || { echo "::error::DIGEST.md missing — run the collector first"; exit 1; }
          python3 build_digest_payload.py

      - name: Send to Buttondown
        env:
          KEY: ${{ secrets.BUTTONDOWN_KEY }}
        run: |
          test -n "$KEY" || { echo "::error::BUTTONDOWN_KEY is not set"; exit 1; }
          code=$(curl -sS -o response.json -w "%{http_code}" \
            -X POST https://api.buttondown.com/v1/emails \
            -H "Authorization: Token $KEY" \
            -H "Content-Type: application/json" \
            --data-binary @payload.json)
          echo "HTTP $code"
          head -c 1200 response.json; echo
          test "$code" -lt 300 || { echo "::error::Buttondown rejected the request"; exit 1; }
          echo "Sent."

      - name: Report
        if: always()
        run: |
          { echo "## Digest"; echo '```'; head -30 DIGEST.md; echo '```'; } >> $GITHUB_STEP_SUMMARY
