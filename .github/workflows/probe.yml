name: probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Test every source
        run: |
          python3 collect.py --probe 2>&1 | tee probe.txt
          echo "" >> probe.txt
          python3 prices.py --probe 2>&1 | tee -a probe.txt || true

      - name: Report
        if: always()
        run: |
          {
            echo "## Source check"
            echo '```'
            cat probe.txt
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
