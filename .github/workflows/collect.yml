name: collect

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      backfill_weeks:
        description: "Weeks of GDELT history to pull (0 = normal run)"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Backfill (only when you ask for it)
        if: github.event.inputs.backfill_weeks != '0' && github.event.inputs.backfill_weeks != ''
        env:
          NEWSAPI_AI_KEY: ${{ secrets.NEWSAPI_AI_KEY }}
        run: python3 collect.py --backfill --weeks ${{ github.event.inputs.backfill_weeks }}

      - name: Collect
        env:
          NEWSAPI_AI_KEY: ${{ secrets.NEWSAPI_AI_KEY }}
        run: python3 collect.py 2>&1 | tee run.txt

      - name: Report
        if: always()
        run: |
          {
            echo "## Chorus collection"
            echo '```'
            tail -40 run.txt
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
          python3 - <<'PY' >> $GITHUB_STEP_SUMMARY || true
          import json
          d = json.load(open("data.json"))
          print(f"\n**{d['articlesStored']}** articles over **{d['daysCollected']}** days "
                f"({d.get('articlesLive','?')} live)\n")
          print("| phrase | sectors | direction | newest |")
          print("|---|---|---|---|")
          for t in d["terms"][:15]:
              print(f"| {t['term']} | {t['sectorCount']} | {t['direction']} | "
                    f"{t['newestSector']} ({t['daysSinceNewestSector']}d) |")
          PY

      - name: Save
        run: |
          git config user.name  "chorus-collector"
          git config user.email "collector@users.noreply.github.com"
          git add chorus.db data.json
          git diff --staged --quiet || git commit -m "collect $(date -u +'%Y-%m-%d %H:%M')"
          git push
