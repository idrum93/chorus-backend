# Save as .github/workflows/edgar.yml
#
# Two modes. "probe" checks the API structure and changes nothing.
# "build" fetches the industry breakdown for tracked phrases and commits it.

name: edgar

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'probe = check structure, build = fetch industry history'
        required: true
        default: 'probe'
        type: choice
        options: [probe, build]
      from_year:
        description: 'Build only — how far back to go'
        required: false
        default: '2016'
      phrases:
        description: 'Build only — how many tracked phrases'
        required: false
        default: '10'

permissions:
  contents: write

concurrency:
  group: edgar
  cancel-in-progress: false

jobs:
  edgar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Probe structure
        if: github.event.inputs.mode == 'probe'
        continue-on-error: true
        env:
          EDGAR_UA: ${{ secrets.EDGAR_UA }}
        run: python3 edgar.py --probe --probe-sic 2>&1 | tee edgar.txt

      - name: Build filing history
        if: github.event.inputs.mode == 'build'
        env:
          EDGAR_UA: ${{ secrets.EDGAR_UA }}
        run: |
          python3 edgar.py --build \
            --from-year ${{ github.event.inputs.from_year }} \
            --limit ${{ github.event.inputs.phrases }} 2>&1 | tee edgar.txt

      - name: Report
        if: always()
        run: |
          { echo "## EDGAR"; echo '```'; tail -60 edgar.txt; echo '```'; } >> $GITHUB_STEP_SUMMARY

      - name: Save
        if: github.event.inputs.mode == 'build'
        run: |
          git config user.name  "crosstalk-collector"
          git config user.email "collector@users.noreply.github.com"
          git add chorus.db
          git diff --staged --quiet && echo "nothing new" && exit 0
          git commit -m "edgar filing history $(date -u +'%Y-%m-%d')"
          git push
