name: refresh
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m mmastat.sources --corpus --no-upcoming
      - run: python -m mmastat.tests --real
      - run: python -m mmastat.sources
        continue-on-error: true
      - run: python -m mmastat.upcoming --json
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      - name: commit
        run: |
          git config user.name "cornerman-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/upcoming.txt site/ || true
          git diff --staged --quiet || git commit -m "refresh"
          git push || echo "nothing to push"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
